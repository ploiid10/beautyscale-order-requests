server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $upstream http://api:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /healthz {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $upstream http://api:8080;
        proxy_pass $upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
